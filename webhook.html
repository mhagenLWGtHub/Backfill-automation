<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Business Directory — State Search</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --accent:#0b74de;
      --muted:#666;
      --modal-bg: rgba(12,12,12,0.6);
    }
    body{
      margin:0;
      font-family:Inter, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:#111;
      -webkit-font-smoothing:antialiased;
    }
    .wrap { max-width:1100px; margin:28px auto; padding:18px; }
    .top {
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:12px;
    }
    h1 { margin:0; font-size:20px; }
    .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }

    input[type="text"], select {
      padding:10px 12px;
      border-radius:8px;
      border:1px solid #ddd;
      font-size:14px;
      min-width:160px;
    }
    button {
      padding:10px 12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:600;
      background:var(--accent);
      color:#fff;
    }
    button.ghost { background:transparent; color:var(--accent); border:1px solid #e1e7ff; }

    .layout {
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:16px;
    }

    /* Left sidebar (filters / states) */
    .sidebar { background:var(--card); border-radius:10px; padding:12px; border:1px solid #eee; min-height:480px; }
    .states-list { display:flex; flex-direction:column; gap:6px; max-height:520px; overflow:auto; padding-right:6px; }
    .state-btn {
      text-align:left;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid #f0f0f0;
      background:#fff;
      cursor:pointer;
    }
    .state-btn.active { outline:3px solid rgba(11,116,222,0.12); transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,0.04); }

    /* Main area */
    .content { }
    .summary { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .cards { display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:12px; }

    .card {
      background:var(--card);
      border-radius:10px;
      padding:12px;
      border:1px solid #eee;
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:120px;
      cursor:pointer;
    }
    .card .title { font-weight:700; display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .card .meta { font-size:13px; color:var(--muted); }
    .chip { padding:6px 8px; border-radius:8px; font-size:12px; color:#fff; }

    /* modal */
    .modal-wrap { display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:60; }
    .modal-bg { position:absolute; inset:0; background:var(--modal-bg); }
    .modal { position:relative; background:#fff; border-radius:10px; padding:18px; width:680px; max-width:95%; z-index:61; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
    .modal h3 { margin:0 0 8px 0; }
    .modal .row { display:flex; gap:12px; margin-bottom:8px; }
    .modal .kv { flex:1; background:#fbfbfb; padding:10px; border-radius:8px; border:1px solid #f0f0f0; font-size:14px; }
    .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }

    /* responsive */
    @media (max-width:980px){
      .layout { grid-template-columns: 1fr; }
      .sidebar { order:2; }
      .content { order:1; }
      .summary { flex-direction:column; align-items:stretch; gap:8px; }
    }

    /* small helper */
    .muted { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Business Directory — Search by State</h1>
        <div class="muted">Test data only — placeholder names, emails, phones, addresses and owners.</div>
      </div>

      <div class="controls">
        <input id="globalSearch" type="text" placeholder="Search by business name, type, owner..." oninput="renderFiltered()" />
        <select id="typeFilter" onchange="renderFiltered()">
          <option value="">All types</option>
        </select>
        <button onclick="downloadFiltered()">Download Filtered CSV</button>
        <button class="ghost" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="layout">
      <!-- sidebar: states -->
      <div class="sidebar">
        <h3 style="margin-top:0">States</h3>
        <div style="margin-bottom:10px;">
          <input id="stateSearch" type="text" placeholder="Search states..." oninput="renderStates()" style="width:100%;"/>
        </div>
        <div class="states-list" id="statesList"></div>

        <div style="margin-top:12px; display:flex; gap:8px;">
          <button onclick="downloadState()">Download Selected State CSV</button>
          <button class="ghost" onclick="clearSelectedState()">Clear</button>
        </div>
      </div>

      <!-- main content -->
      <div class="content">
        <div class="summary">
          <div id="selectedStateLabel" style="font-weight:700">Selected state: <span id="selState">(none)</span></div>
          <div class="muted" id="counts"></div>
        </div>

        <div class="cards" id="cardsWrap">
          <!-- cards rendered here -->
        </div>
      </div>
    </div>
  </div>

  <!-- modal for business details -->
  <div class="modal-wrap" id="modalWrap">
    <div class="modal-bg" onclick="closeModal()"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Business Details</h3>
      <div id="modalBody">
        <!-- populated dynamically -->
      </div>
      <div class="actions">
        <button class="ghost" onclick="closeModal()">Close</button>
        <button onclick="downloadBusinessFromModal()">Download Business CSV</button>
      </div>
    </div>
  </div>

<script>
/* -------------------------
  Authentication check (works with your index.html login)
  - Accepts localStorage username/password 'USER' / 'ADMIN' (any case)
--------------------------*/
(function initAuth(){
  const u = localStorage.getItem('username'), p = localStorage.getItem('password');
  if(!u || !p || u.toUpperCase() !== 'USER' || p.toUpperCase() !== 'ADMIN'){
    // redirect back to index (login)
    window.location.href = 'index.html';
  }
})();

/* -------------------------
  Business types: ~20 types
--------------------------*/
const BUSINESS_TYPES = [
  'Gas Station','Restaurant','Clothing Store','Grocery','Pharmacy',
  'Bakery','Coffee Shop','Bar','Bookstore','Electronics Store',
  'Auto Repair','Salon','Gym','Hardware Store','Furniture Store',
  'Laundry','Florist','Dry Cleaner','Convenience Store','Pet Store'
];

/* color map for types */
const typeColors = {};
(function assignColors(){
  const palette = [
    '#FF6B6B','#FF9F43','#00B8A9','#6BCB77','#4D96FF',
    '#9B59B6','#FF8AD2','#FFB86B','#6bc9ff','#E67E22',
    '#D98A8A','#7FD3A5','#B2FF9E','#F6C9FF','#C3E0FF',
    '#F7D794','#BCE29E','#A6E3E9','#F5B8B8','#E5E7EB'
  ];
  BUSINESS_TYPES.forEach((t,i) => typeColors[t] = palette[i % palette.length]);
})();

/* -------------------------
  Fake dataset: states and 10 businesses per state
  - For testing we create e.g. 6 states; each state 10 businesses.
  - Placeholder values use simple patterns.
--------------------------*/
const STATES = ['California','Texas','Florida','New York','Illinois','Arizona'];

const businesses = []; // will be filled with objects

(function buildFakeData(){
  let id = 1;
  for(const st of STATES){
    // pick 10 different types for this state (but ensure repeats across states)
    const types = shuffle(BUSINESS_TYPES).slice(0,10);
    for(let i=0;i<10;i++){
      const t = types[i];
      const shortType = t.replace(/\s+/g,'').toLowerCase();
      const biz = {
        id: 'B' + (id++).toString().padStart(4,'0'),
        name: `${t} ${i+1} (${st.slice(0,3).toUpperCase()})`,
        type: t,
        email: `${shortType}${i+1}@example-${st.slice(0,3).toLowerCase()}.test`,
        phone: randomPhone(st),
        address: `${100 + i} ${t.split(' ')[0]} St, ${st}, ZIP ${10000 + i}`,
        owner: `Owner ${firstName()} ${lastName()}`,
        avg_walk_in: randInt(5,200),
        avg_delivery: randInt(0,100),
        avg_online: randInt(0,150),
        monthly_revenue_est: `$${randInt(1000,150000).toLocaleString()}`,
        rating: (Math.random() * 2 + 3).toFixed(1), // 3.0 - 5.0
        notes: `Test data for automation. Category: ${t}. Built for state ${st}.`,
        state: st,
        created_at: new Date().toISOString()
      };
      businesses.push(biz);
    }
  }
})();

/* utils */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function firstName(){ const a=['Alex','Sam','Jordan','Taylor','Casey','Morgan','Jamie','Riley','Cameron','Avery']; return a[randInt(0,a.length-1)]; }
function lastName(){ const b=['Reed','Hayes','Keller','Reynolds','Fisher','Turner','Parker','Cole','Wood','Brooks']; return b[randInt(0,b.length-1)]; }
function randomPhone(state){ return `+1-555-${(100 + randInt(0,899)).toString().padStart(3,'0')}-${(1000 + randInt(0,899)).toString().slice(1)}`; }
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

/* -------------------------
  Render state list
--------------------------*/
let selectedState = null;
const statesListEl = document.getElementById('statesList');
const selStateLabel = document.getElementById('selState');
const countsEl = document.getElementById('counts');

function renderStates(filter=''){
  const q = (filter || document.getElementById('stateSearch').value || '').trim().toLowerCase();
  statesListEl.innerHTML = '';
  STATES.filter(s => !q || s.toLowerCase().includes(q)).forEach(st => {
    const btn = document.createElement('button');
    btn.className = 'state-btn' + (selectedState === st ? ' active' : '');
    btn.textContent = `${st} (${businesses.filter(b=>b.state===st).length})`;
    btn.onclick = () => { selectState(st); };
    statesListEl.appendChild(btn);
  });
}
renderStates();

/* render types into filter dropdown */
const typeFilterEl = document.getElementById('typeFilter');
(function populateTypes(){
  BUSINESS_TYPES.forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t;
    typeFilterEl.appendChild(o);
  });
})();

/* -------------------------
  Render business cards for selected state and search filter
--------------------------*/
const cardsWrap = document.getElementById('cardsWrap');
const globalSearchEl = document.getElementById('globalSearch');

function selectState(st){
  selectedState = st;
  selStateLabel.textContent = st;
  // mark active in states list
  renderStates();
  renderFiltered();
  countsEl.textContent = `${businesses.filter(b=>b.state===st).length} businesses in ${st}`;
}

/* initial none selected: show all */
function renderCards(list){
  cardsWrap.innerHTML = '';
  if(!list || list.length === 0){
    cardsWrap.innerHTML = '<div style="grid-column:1/-1;padding:28px;background:#fff;border-radius:8px;border:1px solid #eee;">No businesses match your filter.</div>';
    return;
  }
  list.forEach(b => {
    const c = document.createElement('div');
    c.className = 'card';
    c.onclick = () => openModalFor(b);
    const color = typeColors[b.type] || '#ccc';
    c.innerHTML = `
      <div class="title">
        <div>
          <div style="font-size:15px">${escapeHtml(b.name)}</div>
          <div class="meta">${escapeHtml(b.address)}</div>
        </div>
        <div style="text-align:right">
          <div class="chip" style="background:${color}">${b.type}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">${b.rating} ★</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;gap:8px">
        <div class="muted">Owner: ${escapeHtml(b.owner)}</div>
        <div class="muted">${b.phone}</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;">
        <div class="muted">Monthly est: <strong>${b.monthly_revenue_est}</strong></div>
        <div class="muted">State: <strong>${escapeHtml(b.state)}</strong></div>
      </div>
    `;
    cardsWrap.appendChild(c);
  });
}

/* filter logic: state + type + global search */
function renderFiltered(){
  const q = (globalSearchEl.value || '').trim().toLowerCase();
  const type = (typeFilterEl.value || '').trim();
  let list = businesses.slice();

  if(selectedState){
    list = list.filter(b => b.state === selectedState);
  }
  if(type){
    list = list.filter(b => b.type === type);
  }
  if(q){
    list = list.filter(b => {
      return b.name.toLowerCase().includes(q)
          || b.type.toLowerCase().includes(q)
          || b.owner.toLowerCase().includes(q)
          || b.email.toLowerCase().includes(q)
          || b.address.toLowerCase().includes(q)
          || b.notes.toLowerCase().includes(q);
    });
  }

  renderCards(list);
  countsEl.textContent = `${(selectedState ? list.length : list.length)} businesses shown`;
}

/* initial render (all) */
renderFiltered();

/* -------------------------
  Modal: show business details + download single business CSV
--------------------------*/
let currentModalBusiness = null;
function openModalFor(biz){
  currentModalBusiness = biz;
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  const rows = [
    ['ID', biz.id],
    ['Name', biz.name],
    ['Type', biz.type],
    ['Owner', biz.owner],
    ['Email', biz.email],
    ['Phone', biz.phone],
    ['Address', biz.address],
    ['State', biz.state],
    ['Avg walk-in', biz.avg_walk_in],
    ['Avg delivery', biz.avg_delivery],
    ['Avg online', biz.avg_online],
    ['Monthly revenue estimate', biz.monthly_revenue_est],
    ['Rating', biz.rating],
    ['Notes', biz.notes],
    ['Created at', biz.created_at]
  ];
  // render rows in two-column layout
  const frag = document.createElement('div');
  for(let i=0;i<rows.length;i+=2){
    const r1 = rows[i], r2=rows[i+1];
    const row = document.createElement('div'); row.className='row';
    const kv1 = document.createElement('div'); kv1.className='kv'; kv1.innerHTML = `<strong>${escapeHtml(r1[0])}</strong><div>${escapeHtml(String(r1[1]))}</div>`;
    row.appendChild(kv1);
    if(r2){
      const kv2 = document.createElement('div'); kv2.className='kv'; kv2.innerHTML = `<strong>${escapeHtml(r2[0])}</strong><div>${escapeHtml(String(r2[1]))}</div>`;
      row.appendChild(kv2);
    } else {
      const kv2 = document.createElement('div'); kv2.className='kv'; kv2.style.visibility='hidden'; row.appendChild(kv2);
    }
    frag.appendChild(row);
  }
  body.appendChild(frag);
  document.getElementById('modalWrap').style.display = 'flex';
  document.getElementById('modalWrap').scrollTop = 0;
}

function closeModal(){
  currentModalBusiness = null;
  document.getElementById('modalWrap').style.display = 'none';
}

/* download single business CSV (modal) */
function downloadBusinessFromModal(){
  if(!currentModalBusiness) return alert('No business loaded.');
  const rows = [currentModalBusiness];
  downloadCSVRows(`${currentModalBusiness.name.replace(/\s+/g,'_')}.csv`, rows);
}

/* -------------------------
  Download helpers: filtered, state, build CSV
--------------------------*/
function buildCSVFromObjects(arr){
  if(!arr || arr.length === 0) return '';
  const cols = Object.keys(arr[0]);
  const header = cols.join(',');
  const lines = arr.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','));
  return [header, ...lines].join('\n');
}

function downloadBlob(filename, text){
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadCSVRows(filename, rows){
  if(!rows || rows.length === 0) return alert('No rows to download.');
  const csv = buildCSVFromObjects(rows);
  downloadBlob(filename, csv);
}

function downloadFiltered(){
  // build from currently rendered cards
  const nodes = Array.from(document.querySelectorAll('.card'));
  if(nodes.length === 0) return alert('No items to download.');
  // map back to business objects by name & id
  const visibleNames = nodes.map(n => n.querySelector('.title > div > div').innerText.trim());
  const rows = businesses.filter(b => visibleNames.includes(b.name));
  downloadCSVRows('filtered_businesses.csv', rows);
}

function downloadState(){
  if(!selectedState) return alert('No state selected.');
  const rows = businesses.filter(b => b.state === selectedState);
  if(rows.length === 0) return alert('Selected state has no businesses.');
  downloadCSVRows(`${selectedState.replace(/\s+/g,'_')}_businesses.csv`, rows);
}

/* clear selected state */
function clearSelectedState(){
  selectedState = null;
  selStateLabel.textContent = '(none)';
  renderStates();
  renderFiltered();
  countsEl.textContent = '';
}

/* logout */
function logout(){
  localStorage.removeItem('username'); localStorage.removeItem('password');
  window.location.href = 'index.html';
}

/* small helper to escape HTML */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
  });
}

/* initial select first state for convenience */
selectState(STATES[0]);
renderStates();

</script>
</body>
</html>
