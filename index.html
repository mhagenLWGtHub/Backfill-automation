<!DOCTYPE html>
<html>
  <head>
    <script src="https://dl.frontapp.com/libs/frontjs.min.js"></script>
    <style>
      /* --- GLOBAL STYLES (DARK MODE) --- */
      body { 
        margin: 0; padding: 15px; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #1C1C1C; color: white; 
      }

      /* --- LOGO --- */
      .logo-container { text-align: center; margin-bottom: 20px; }
      .logo-img { max-width: 150px; height: auto; }

      /* --- BUTTONS --- */
      button {
        width: 100%; background-color: #333333; color: white;
        border: 1px solid #444; border-radius: 6px;
        font-weight: 600; cursor: pointer; padding: 12px 15px;
        margin-bottom: 8px; font-size: 14px; transition: all 0.2s ease;
        text-align: left; 
      }
      button:hover { background-color: #444444; border-color: #666; padding-left: 20px; }

      .action-btn { text-align: center; }
      .action-btn:hover { padding-left: 15px; }

      /* --- TRANSPARENT BUTTONS (Folderless) --- */
      .transparent-btn {
        background-color: transparent !important;
        border: none !important;
        color: #999; margin-bottom: 2px; padding-left: 0;
      }
      .transparent-btn:hover {
        background-color: #444444 !important; 
        color: white !important; 
        border-radius: 6px; padding-left: 15px; 
      }

      /* --- FORM STYLES --- */
      label { display: block; color: #888; font-size: 12px; margin-bottom: 5px; margin-top: 15px; }
      input, textarea, select {
        width: 100%; box-sizing: border-box;
        background: #2C2C2C; border: 1px solid #444; color: white;
        padding: 10px; border-radius: 6px; font-size: 14px;
        outline: none;
      }
      input:focus, textarea:focus, select:focus { border-color: #3165ff; }
      textarea { resize: vertical; min-height: 80px; }
      
      .submit-btn {
        background-color: #3165ff; border: none; margin-top: 20px; text-align: center;
      }
      .submit-btn:hover { background-color: #254eda; padding-left: 15px; }

      /* --- UTILITIES --- */
      .section-label {
        color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
        margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;
      }
      h3 { margin: 0 0 15px 0; font-size: 16px; color: white; text-align: center; }
      .hidden { display: none; }
      .back-link {
        display: block; text-align: center; color: #666; font-size: 12px;
        margin-top: 20px; cursor: pointer; text-decoration: none;
      }
      .back-link:hover { text-decoration: underline; color: #3165ff; }

      /* --- SPINNER --- */
      .loader-container { text-align: center; margin-top: 50px; }
      .spinner {
        border: 4px solid #333; border-top: 4px solid #3165ff;
        border-radius: 50%; width: 40px; height: 40px;
        animation: spin 1s linear infinite; margin: 0 auto 15px auto; display: block; 
      }
      .loading-text { color: #888; font-size: 13px; letter-spacing: 0.5px; margin-top: 10px;}
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <div id="step-1">
      <div class="logo-container">
        <img src="https://via.placeholder.com/150x50/333333/FFFFFF?text=YOUR+LOGO" class="logo-img" alt="Logo">
      </div>
      <button class="action-btn" onclick="goToStep2('create a new task')">Create a New Task</button>
      <button class="action-btn" onclick="goToStep2('update task')">Update a Task</button>
      <button class="action-btn" onclick="goToStep2('delete task')">Delete a Task</button>
    </div>

    <div id="step-2" class="hidden">
      <h3>Which space is the task located?</h3>
      <div id="space-list">
        <button onclick="handleSpaceClick('Acquisitions')">Acquisitions</button>
        <button onclick="handleSpaceClick('Marketing')">Marketing</button>
        <button onclick="handleSpaceClick('Asset Management')">Asset Management</button>
        <button onclick="handleSpaceClick('Finance')">Finance</button>
        <button onclick="handleSpaceClick('Insurance')">Insurance</button>
        <button onclick="handleSpaceClick('Human Resource')">Human Resource</button>
        <button onclick="handleSpaceClick('Legal')">Legal</button>
        <button onclick="handleSpaceClick('Operations')">Operations</button>
        <button onclick="handleSpaceClick('Company Owners')">Company Owners</button>
        <button onclick="handleSpaceClick('Training')">Training</button>
        <button onclick="handleSpaceClick('Investor Relations')">Investor Relations</button>
        <button onclick="handleSpaceClick('Capital Raising')">Capital Raising</button>
        <button onclick="handleSpaceClick('CCM')">CCM (Chris & Colin)</button>
        <button onclick="handleSpaceClick('SOP and Templates')">SOP and Templates</button>
        <button onclick="handleSpaceClick('Pref Equity Brokers')">Pref Equity Brokers</button>
        <button onclick="handleSpaceClick('Enterprise Risk Mgmt')">Enterprise Risk Mgmt</button>
        <button onclick="handleSpaceClick('Chris Properties')">Chris Properties / PGO LLS Ops</button>
        <button onclick="handleSpaceClick('Chris Mitch')">Chris Mitch</button>
      </div>
      <a class="back-link" onclick="goBack(1)">← Back to Start</a>
    </div>

    <div id="loading-view" class="hidden">
      <div class="loader-container">
        <div class="spinner"></div>
        <div id="loading-text" class="loading-text">Loading...</div>
      </div>
      <a class="back-link" onclick="goBack('loading')">Cancel</a>
    </div>

    <div id="folders-view" class="hidden">
      <h3>Select a Folder</h3>
      <div id="folders-container"></div>
      <a class="back-link" onclick="goBack(2)">← Back to Spaces</a>
    </div>

    <div id="lists-view" class="hidden">
      <h3>Select a List</h3>
      <div id="lists-container"></div>
      <a class="back-link" onclick="goBack(3)">← Back to Folders</a>
    </div>

    <div id="tasks-view" class="hidden">
      <h3>Select a Task</h3>
      <div id="tasks-container"></div>
      <a class="back-link" onclick="goBack(4)">← Back to Lists</a>
    </div>

    <div id="form-view" class="hidden">
      <h3 id="form-title">Create a New Task</h3>
      
      <label>Title <span style="color:#ff5555">*</span></label>
      <input type="text" id="task-title" placeholder="Enter task title...">

      <label>Description</label>
      <textarea id="task-desc" placeholder="Enter details..."></textarea>

      <label>Assignee</label>
      <select id="task-assignee">
        <option value="" disabled selected>Select an assignee...</option>
        <option value="Chris Pomerleau">Chris Pomerleau</option>
        <option disabled>──────────</option>
        <option value="angie@liquidlendingsolutions.com">angie@liquidlendingsolutions.com</option>
        <option value="Augie Kouri">Augie Kouri</option>
        <option value="Bailey Thurman">Bailey Thurman</option>
        <option value="Brandon Tauber">Brandon Tauber</option>
        <option value="Brian Nelson">Brian Nelson</option>
        <option value="Bruce Pomerleau">Bruce Pomerleau</option>
        <option value="Cane Bueno">Cane Bueno</option>
        <option value="collin Schwartz">collin Schwartz</option>
        <option value="Danny Humsi">Danny Humsi</option>
        <option value="jason@leavenwealth.com">jason@leavenwealth.com</option>
        <option value="Jay Delgado">Jay Delgado</option>
        <option value="John Younes">John Younes</option>
        <option value="Kalen Speake">Kalen Speake</option>
        <option value="Lauren Cohodes">Lauren Cohodes</option>
        <option value="Lauren Forsch">Lauren Forsch</option>
        <option value="Luke Schollmeyer">Luke Schollmeyer</option>
        <option value="Maren Larson">Maren Larson</option>
        <option value="Megan Hudson">Megan Hudson</option>
        <option value="Megan Richardson">Megan Richardson</option>
        <option value="Mitchell Hagen">Mitchell Hagen</option>
        <option value="Nathan Farha">Nathan Farha</option>
        <option value="Nick Bruhn">Nick Bruhn</option>
        <option value="Owen Dashner">Owen Dashner</option>
        <option value="Rachel Lund">Rachel Lund</option>
      </select>

      <button class="submit-btn" onclick="submitForm()">Submit</button>

      <a class="back-link" onclick="goBack('form')">← Cancel</a>
    </div>

    <script>
      // === CONFIGURATION ===
      const WEBHOOK_URL = 'https://leavenwealth.app.n8n.cloud/webhook/4fa80722-bad9-4b29-b5e2-8fd23cff22af'; 

      // === STATE ===
      let currentAction = ''; 
      let currentSpace = '';
      let currentFolder = '';
      let currentList = '';
      let currentTask = '';

      // --- NAVIGATION CONTROLLER ---
      function goToStep2(action) {
        currentAction = action;
        
        if (action === 'create a new task') {
            document.getElementById('form-title').innerText = "Create a New Task";
        } else if (action === 'update task') {
            document.getElementById('form-title').innerText = "Update Task";
        } else {
            document.getElementById('form-title').innerText = "Task Details";
        }

        showView('step-2');
      }

      function goBack(step) {
        if (step === 1) showView('step-1');
        else if (step === 2) showView('step-2');
        else if (step === 3) showView('folders-view');
        else if (step === 4) showView('lists-view');
        else if (step === 'loading') showView('step-2'); 
        else if (step === 'form') showView('tasks-view');
      }

      function showView(viewId) {
        const views = ['step-1', 'step-2', 'loading-view', 'folders-view', 'lists-view', 'tasks-view', 'form-view'];
        views.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
      }

      // === STEP 2 -> 3: GET FOLDERS ===
      async function handleSpaceClick(spaceName) {
        currentSpace = spaceName;
        currentFolder = ''; // Reset
        
        document.getElementById('loading-text').innerText = "Getting the list of folders...";
        showView('loading-view');

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: currentAction, 
              space: spaceName,
              type: "get folder"
            })
          });

          if (!response.ok) throw new Error("Network response was not ok");
          const data = await response.json(); 
          renderFolders(data);
          showView('folders-view');

        } catch (error) {
          console.error("Error:", error);
          // If error (like timeout or network), user can click cancel.
        }
      }

      // --- UPDATED RENDER FOLDERS ---
      function renderFolders(dataList) {
        const container = document.getElementById('folders-container');
        container.innerHTML = ''; 

        if (!Array.isArray(dataList)) {
           container.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">No data received.</div>';
           return;
        }

        let hasItems = false;

        // 1. Folders -> Fetch Lists
        dataList.forEach(item => {
          // CHECK FOR: Array name OR String name
          let itemName = item.name;
          
          // Fix: Handle if name is an Array like ["No Folders in this list"]
          if (Array.isArray(itemName) && itemName.length > 0) {
             itemName = itemName[0];
          }

          // IGNORE if it says "No Folders..."
          if (itemName && 
              itemName !== "No Folders in this list" && 
              itemName !== "no folder in this space") {
            
            const btn = document.createElement('button');
            btn.innerText = itemName;
            btn.onclick = () => handleFolderClick(itemName); 
            container.appendChild(btn);
            hasItems = true;
          }
        });

        // 2. Folderless -> Fetch Tasks
        dataList.forEach(item => {
          if (item.folderless && Array.isArray(item.folderless) && item.folderless.length > 0) {
            const label = document.createElement('div');
            label.className = 'section-label';
            label.innerText = 'Folderless List';
            container.appendChild(label);

            item.folderless.forEach(listName => {
              const btn = document.createElement('button');
              btn.innerText = listName;
              btn.className = 'transparent-btn';
              btn.onclick = () => handleListClick(listName); // Folderless items ARE lists
              container.appendChild(btn);
            });
            hasItems = true;
          }
        });

        // 3. EMPTY STATE CHECK
        // If we looped through everything and found no valid folders or lists:
        if (!hasItems) {
            container.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">No lists in this space</div>';
        }
      }

      // === STEP 3 -> 4: GET LISTS ===
      async function handleFolderClick(folderName) {
        currentFolder = folderName;
        document.getElementById('loading-text').innerText = "Getting your lists...";
        showView('loading-view');

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: currentAction, 
              space: currentSpace,
              folder: folderName,
              type: "get list"
            })
          });

          if (!response.ok) throw new Error("Network response was not ok");
          const data = await response.json(); 
          renderLists(data);
          showView('lists-view');

        } catch (error) {
          console.error("Error:", error);
        }
      }

      function renderLists(dataList) {
        const container = document.getElementById('lists-container');
        container.innerHTML = ''; 

        if (!Array.isArray(dataList) || dataList.length === 0) {
           container.innerHTML = '<div style="text-align:center; color:#888;">No lists found.</div>';
           return;
        }

        dataList.forEach(item => {
          const btn = document.createElement('button');
          btn.innerText = item.name; 
          btn.onclick = () => handleListClick(item.name);
          container.appendChild(btn);
        });
      }

      // === STEP 4 -> 5: GET TASKS ===
      async function handleListClick(listName) {
        currentList = listName;
        document.getElementById('loading-text').innerText = "Getting your tasks...";
        showView('loading-view');

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: currentAction, 
              space: currentSpace,
              folder: currentFolder,
              list: listName,
              type: "get task"
            })
          });

          if (!response.ok) throw new Error("Network response was not ok");
          const data = await response.json(); 
          renderTasks(data);
          showView('tasks-view');

        } catch (error) {
          console.error("Error:", error);
        }
      }

      function renderTasks(dataList) {
        const container = document.getElementById('tasks-container');
        container.innerHTML = ''; 

        if (!Array.isArray(dataList) || dataList.length === 0) {
           container.innerHTML = '<div style="text-align:center; color:#888;">No tasks found.</div>';
           return;
        }

        dataList.forEach(item => {
          const btn = document.createElement('button');
          btn.innerText = item.name; 
          btn.onclick = () => showForm(item.name);
          container.appendChild(btn);
        });
      }

      // === STEP 6: FORM ===
      function showForm(taskName) {
        currentTask = taskName;
        showView('form-view');
      }

      // --- SUBMIT FORM ---
      function submitForm() {
        const title = document.getElementById('task-title').value;
        const desc = document.getElementById('task-desc').value;
        const assignee = document.getElementById('task-assignee').value;

        if(!title) {
          alert("Title is required!");
          return;
        }

        console.log("Submitting:", { 
            action: currentAction,
            space: currentSpace,
            folder: currentFolder,
            list: currentList,
            task: currentTask,
            formData: { title, desc, assignee }
        });
        
        alert("Form Submitted! (Check Console)");
      }
    </script>
  </body>
</html>
