<!DOCTYPE html>
<html>
  <head>
    <script src="https://dl.frontapp.com/libs/frontjs.min.js"></script>
    
    <style>
      /* 2. THE LOOKS: This makes the button big and blue */
      body { margin: 0; padding: 10px; font-family: sans-serif; }
      button {
        background-color: #3165ff; 
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover { background-color: #1e4bd1; }
    </style>
  </head>
  <body>

    <button id="btn">Open n8n Form</button>

    <script>
      const formUrl = 'https://leavenwealth.app.n8n.cloud/form/fe2462c2-158c-4bb3-9d0e-9d0277544570';

      // This waits for the button to be clicked
      document.getElementById('btn').addEventListener('click', function() {
        // Try to open via Front SDK first
        if (window.Front && window.Front.openUrl) {
          window.Front.openUrl({ url: formUrl });
        } else {
          // If that fails, force a new browser tab
          window.open(formUrl, '_blank');
        }
      });
    </script>
  </body>
</html>
