<!DOCTYPE html>
<html>
  <head>
    <script src="https://dl.frontapp.com/libs/frontjs.min.js"></script>
    <style>
      body { margin: 0; padding: 10px; background: white; font-family: sans-serif; }
      #btn {
        background-color: #3165ff; 
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        border-radius: 5px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
      }
      #btn:hover { background-color: #1e4bd1; }
    </style>
  </head>
  <body>

    <button id="btn">Open n8n Form</button>

    <script>
      const formUrl = 'https://leavenwealth.app.n8n.cloud/form/fe2462c2-158c-4bb3-9d0e-9d0277544570';

      // Attach the click immediately so it never feels "broken"
      document.getElementById('btn').addEventListener('click', function() {
        if (window.Front && window.Front.openUrl) {
          // If we are in Front, use the Front tool
          window.Front.openUrl({ url: formUrl });
        } else {
          // If the Front tool fails, force a standard new window
          window.open(formUrl, '_blank');
        }
      });
    </script>
  </body>
</html>
