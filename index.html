<!DOCTYPE html>
<html>
  <head>
    <script src="https://dl.frontapp.com/libs/frontjs.min.js"></script>
    <style>
      /* --- GLOBAL STYLES (DARK MODE) --- */
      body { 
        margin: 0; padding: 15px; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #1C1C1C; color: white; 
      }

      /* --- LOGO --- */
      .logo-container { text-align: center; margin-bottom: 20px; }
      .logo-img { max-width: 150px; height: auto; }

      /* --- BUTTONS --- */
      button {
        width: 100%; background-color: #333333; color: white;
        border: 1px solid #444; border-radius: 6px;
        font-weight: 600; cursor: pointer; padding: 12px 15px;
        margin-bottom: 8px; font-size: 14px; transition: all 0.2s ease;
        text-align: left; 
      }
      button:hover { background-color: #444444; border-color: #666; padding-left: 20px; }

      .action-btn { text-align: center; }
      .action-btn:hover { padding-left: 15px; }

      /* --- LOADING SPINNER (CANDLE) --- */
      .loader-container { text-align: center; margin-top: 50px; }
      .spinner {
        border: 4px solid #333; border-top: 4px solid #3165ff;
        border-radius: 50%; width: 40px; height: 40px;
        animation: spin 1s linear infinite; margin: 0 auto 15px auto;
      }
      .loading-text { color: #888; font-size: 13px; letter-spacing: 0.5px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* --- UTILITIES --- */
      h3 { margin: 0 0 15px 0; font-size: 16px; color: white; text-align: center; }
      .hidden { display: none; }
      .back-link {
        display: block; text-align: center; color: #666; font-size: 12px;
        margin-top: 20px; cursor: pointer; text-decoration: none;
      }
      .back-link:hover { text-decoration: underline; color: #3165ff; }
    </style>
  </head>
  <body>

    <div id="step-1">
      <div class="logo-container">
        <img src="https://via.placeholder.com/150x50/333333/FFFFFF?text=YOUR+LOGO" class="logo-img" alt="Logo">
      </div>
      <button class="action-btn" onclick="goToStep2('Create a New Task')">Create a New Task</button>
      <button class="action-btn" onclick="goToStep2('Update Task')">Update a Task</button>
      <button class="action-btn" onclick="goToStep2('Delete Task')">Delete a Task</button>
    </div>

    <div id="step-2" class="hidden">
      <h3>Which space is the task located?</h3>
      <div id="space-list">
        <button onclick="handleSpaceClick('Acquisitions')">Acquisitions</button>
        <button onclick="handleSpaceClick('Marketing')">Marketing</button>
        <button onclick="handleSpaceClick('Asset Management')">Asset Management</button>
        <button onclick="handleSpaceClick('Finance')">Finance</button>
        <button onclick="handleSpaceClick('Insurance')">Insurance</button>
        <button onclick="handleSpaceClick('Human Resource')">Human Resource</button>
        <button onclick="handleSpaceClick('Legal')">Legal</button>
        <button onclick="handleSpaceClick('Operations')">Operations</button>
        <button onclick="handleSpaceClick('Company Owners')">Company Owners</button>
        <button onclick="handleSpaceClick('Training')">Training</button>
        <button onclick="handleSpaceClick('Investor Relations')">Investor Relations</button>
        <button onclick="handleSpaceClick('Capital Raising')">Capital Raising</button>
        <button onclick="handleSpaceClick('CCM')">CCM (Chris & Colin)</button>
        <button onclick="handleSpaceClick('SOP and Templates')">SOP and Templates</button>
        <button onclick="handleSpaceClick('Pref Equity Brokers')">Pref Equity Brokers</button>
        <button onclick="handleSpaceClick('Enterprise Risk Mgmt')">Enterprise Risk Mgmt</button>
        <button onclick="handleSpaceClick('Chris Properties')">Chris Properties / PGO LLS Ops</button>
        <button onclick="handleSpaceClick('Chris Mitch')">Chris Mitch</button>
      </div>
      <a class="back-link" onclick="goBack(1)">← Back to Start</a>
    </div>

    <div id="loading-view" class="hidden">
      <div class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Getting the list of folders...</div>
      </div>
    </div>

    <div id="dynamic-folders-view" class="hidden">
      <h3 id="folder-title">Select a Folder</h3>
      
      <div id="folders-container"></div>

      <a class="back-link" onclick="goBack(2)">← Back to Spaces</a>
    </div>

    <script>
      // === CONFIGURATION ===
      // Your n8n Webhook URL
      const WEBHOOK_URL = 'https://leavenwealth.app.n8n.cloud/webhook/4fa80722-bad9-4b29-b5e2-8fd23cff22af'; 

      let currentAction = ''; 

      // --- NAVIGATION ---
      function goToStep2(action) {
        currentAction = action;
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
      }

      function goBack(toStep) {
        if (toStep === 1) {
          document.getElementById('step-2').classList.add('hidden');
          document.getElementById('step-1').classList.remove('hidden');
        } else if (toStep === 2) {
          document.getElementById('dynamic-folders-view').classList.add('hidden');
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('step-2').classList.remove('hidden');
          // Clear old buttons so they don't stack up
          document.getElementById('folders-container').innerHTML = '';
        }
      }

      // --- THE WEBHOOK LOGIC ---
      async function handleSpaceClick(spaceName) {
        // 1. Switch UI to Loading State
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('loading-view').classList.remove('hidden');

        try {
          // 2. Call n8n
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: currentAction, 
              space: spaceName 
            })
          });

          // 3. Receive the list of folders from n8n
          const folders = await response.json(); 
          
          // 4. Build the buttons dynamically
          renderDynamicButtons(folders);

          // 5. Show the Folder View
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('dynamic-folders-view').classList.remove('hidden');

        } catch (error) {
          console.error("Error fetching folders:", error);
          alert("Error: Could not load folders from n8n.");
          goBack(2); 
        }
      }

      // --- BUTTON GENERATOR ---
      function renderDynamicButtons(folderList) {
        const container = document.getElementById('folders-container');
        container.innerHTML = ''; // Clear container

        // Check if n8n returned an actual list
        if (!Array.isArray(folderList) || folderList.length === 0) {
           container.innerHTML = '<div style="text-align:center; color:#888;">No folders found.</div>';
           return;
        }

        folderList.forEach(folder => {
          const btn = document.createElement('button');
          btn.innerText = folder.name; // Label of the button
          
          // When clicked, open the link provided by n8n
          btn.onclick = function() {
            if (window.Front && window.Front.openUrl) {
              window.Front.openUrl({ url: folder.url });
            } else {
              window.open(folder.url, '_blank');
            }
          };

          container.appendChild(btn);
        });
      }
    </script>
  </body>
</html>
