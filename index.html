<!DOCTYPE html>
<html>
  <head>
    <script src="https://dl.frontapp.com/libs/frontjs.min.js"></script>
    <style>
      /* --- GLOBAL STYLES (DARK MODE) --- */
      body { 
        margin: 0; padding: 15px; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #1C1C1C; color: white; 
      }

      /* --- LOGO --- */
      .logo-container { text-align: center; margin-bottom: 20px; }
      .logo-img { max-width: 150px; height: auto; }

      /* --- BUTTONS --- */
      button {
        width: 100%; background-color: #333333; color: white;
        border: 1px solid #444; border-radius: 6px;
        font-weight: 600; cursor: pointer; padding: 12px 15px;
        margin-bottom: 8px; font-size: 14px; transition: all 0.2s ease;
        text-align: left; 
      }
      button:hover { background-color: #444444; border-color: #666; padding-left: 20px; }

      .action-btn { text-align: center; }
      .action-btn:hover { padding-left: 15px; }

      /* --- FORM STYLES --- */
      label { display: block; color: #888; font-size: 12px; margin-bottom: 5px; margin-top: 15px; }
      input, textarea, select {
        width: 100%; box-sizing: border-box;
        background: #2C2C2C; border: 1px solid #444; color: white;
        padding: 10px; border-radius: 6px; font-size: 14px;
        outline: none;
      }
      /* Special style for date inputs to look good in dark mode */
      input[type="date"] {
        color-scheme: dark;
      }
      input:focus, textarea:focus, select:focus { border-color: #3165ff; }
      textarea { resize: vertical; min-height: 80px; }
      
      .submit-btn {
        background-color: #3165ff; border: none; margin-top: 20px; text-align: center;
      }
      .submit-btn:hover { background-color: #254eda; padding-left: 15px; }

      /* --- UTILITIES --- */
      h3 { margin: 0 0 15px 0; font-size: 16px; color: white; text-align: center; }
      .hidden { display: none; }
      .back-link {
        display: block; text-align: center; color: #666; font-size: 12px;
        margin-top: 20px; cursor: pointer; text-decoration: none;
      }
      .back-link:hover { text-decoration: underline; color: #3165ff; }

      /* --- SPINNER --- */
      .loader-container { text-align: center; margin-top: 50px; }
      .spinner {
        border: 4px solid #333; border-top: 4px solid #3165ff;
        border-radius: 50%; width: 40px; height: 40px;
        animation: spin 1s linear infinite; margin: 0 auto 15px auto; display: block; 
      }
      .loading-text { color: #888; font-size: 13px; letter-spacing: 0.5px; margin-top: 10px;}
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <div id="step-1">
      <div class="logo-container">
        <img src="https://via.placeholder.com/150x50/333333/FFFFFF?text=YOUR+LOGO" class="logo-img" alt="Logo">
      </div>
      <button class="action-btn" onclick="goToStep2('create a new task')">Create a New Task</button>
      <button class="action-btn" onclick="goToStep2('update task')">Update a Task</button>
      <button class="action-btn" onclick="goToStep2('delete task')">Delete a Task</button>
    </div>

    <div id="step-2" class="hidden">
      <h3>Select a Space</h3>
      <div id="space-list">
        <button onclick="handleSpaceClick('Marketing')">Marketing</button>
        <button onclick="handleSpaceClick('Asset Management')">Asset Management</button>
        <button onclick="handleSpaceClick('Finance')">Finance</button>
        <button onclick="handleSpaceClick('Human Resources')">Human Resources</button>
        <button onclick="handleSpaceClick('Legal')">Legal</button>
        <button onclick="handleSpaceClick('Training')">Training</button>
        <button onclick="handleSpaceClick('Investor Relations')">Investor Relations</button>
        <button onclick="handleSpaceClick('Capital Raising')">Capital Raising</button>
        <button onclick="handleSpaceClick('Operations')">Operations</button>
        <button onclick="handleSpaceClick('CCM')">CCM</button>
        <button onclick="handleSpaceClick('Pricing Column')">Pricing Column</button>
        <button onclick="handleSpaceClick('SOP and Templates')">SOP and Templates</button>
        <button onclick="handleSpaceClick('Pref Equity Brokers')">Pref Equity Brokers</button>
        <button onclick="handleSpaceClick('Enterprise Risk Mgmt')">Enterprise Risk Mgmt</button>
        <button onclick="handleSpaceClick('Chris Properties')">Chris Properties</button>
        <button onclick="handleSpaceClick('PGO')">PGO</button>
        <button onclick="handleSpaceClick('LLS Operations')">LLS Operations</button>
        <button onclick="handleSpaceClick('Chris Mitch')">Chris Mitch</button>
      </div>
      <a class="back-link" onclick="goBack(1)">← Back to Start</a>
    </div>

    <div id="folders-view" class="hidden">
      <h3>Select a Folder</h3>
      <div id="folders-container"></div>
      <a class="back-link" onclick="goBack(2)">← Back to Spaces</a>
    </div>

    <div id="loading-view" class="hidden">
      <div class="loader-container">
        <div class="spinner"></div>
        <div id="loading-text" class="loading-text">Loading...</div>
      </div>
      <a class="back-link" onclick="goBack('loading')">Cancel</a>
    </div>

    <div id="items-view" class="hidden">
      <h3 id="items-title">Select Item</h3>
      <div id="items-container"></div>
      <a class="back-link" onclick="goBack(3)">← Back to Folders</a>
    </div>

    <div id="form-view" class="hidden">
      <h3>Create a New Task</h3>
      
      <label>Title <span style="color:#ff5555">*</span></label>
      <input type="text" id="task-title" placeholder="Enter task title...">

      <label>Description</label>
      <textarea id="task-desc" placeholder="Enter details..."></textarea>

      <label>Start Date</label>
      <input type="date" id="task-start-date">

      <label>Due Date</label>
      <input type="date" id="task-due-date">

      <label>Assignee</label>
      <select id="task-assignee">
        <option value="" disabled selected>Select an assignee...</option>
        <option value="Chris Pomerleau">Chris Pomerleau</option>
        <option disabled>──────────</option>
        <option value="angie@liquidlendingsolutions.com">angie@liquidlendingsolutions.com</option>
        <option value="Augie Kouri">Augie Kouri</option>
        <option value="Bailey Thurman">Bailey Thurman</option>
        <option value="Brandon Tauber">Brandon Tauber</option>
        <option value="Brian Nelson">Brian Nelson</option>
        <option value="Bruce Pomerleau">Bruce Pomerleau</option>
        <option value="Cane Bueno">Cane Bueno</option>
        <option value="collin Schwartz">collin Schwartz</option>
        <option value="Danny Humsi">Danny Humsi</option>
        <option value="jason@leavenwealth.com">jason@leavenwealth.com</option>
        <option value="Jay Delgado">Jay Delgado</option>
        <option value="John Younes">John Younes</option>
        <option value="Kalen Speake">Kalen Speake</option>
        <option value="Lauren Cohodes">Lauren Cohodes</option>
        <option value="Lauren Forsch">Lauren Forsch</option>
        <option value="Luke Schollmeyer">Luke Schollmeyer</option>
        <option value="Maren Larson">Maren Larson</option>
        <option value="Megan Hudson">Megan Hudson</option>
        <option value="Megan Richardson">Megan Richardson</option>
        <option value="Mitchell Hagen">Mitchell Hagen</option>
        <option value="Nathan Farha">Nathan Farha</option>
        <option value="Nick Bruhn">Nick Bruhn</option>
        <option value="Owen Dashner">Owen Dashner</option>
        <option value="Rachel Lund">Rachel Lund</option>
      </select>

      <button class="submit-btn" onclick="submitForm()">Submit</button>

      <a class="back-link" onclick="goBack('form')">← Cancel</a>
    </div>

    <script>
      // === CONFIGURATION ===
      const WEBHOOK_URL = 'https://leavenwealth.app.n8n.cloud/webhook/4fa80722-bad9-4b29-b5e2-8fd23cff22af'; 

      // === HARDCODED FOLDER DATA ===
      const spaceData = {
        "Marketing": ["Marketing tasks", "Marketing resources"],
        "Asset Management": ["Asset Management", "Asset Management Folder"],
        "Finance": ["Accounts payable", "Bank accounts", "Bookkeeping", "Loans", "Taxes", "Reporting", "Accounting operations", "Bookkeeping fund", "Miscellaneous finance work", "SPAL Misc finance work", "Trade insurance"],
        "Human Resources": ["Hiring", "New employee onboarding", "Employee retention", "Payroll"],
        "Legal": ["Compliance folder", "Prices folder"],
        "Training": ["LWU", "Clickup", "Onboarding"],
        "Investor Relations": ["Investor relations"],
        "Capital Raising": ["CRM"],
        "Operations": [], 
        "CCM": [], 
        "Pricing Column": [], 
        "SOP and Templates": ["Marketing", "Asset Management", "Finance", "Insurance", "Legal", "Capital Raising", "Operations", "Investor Relations", "Applications", "HR", "Executive"],
        "Pref Equity Brokers": [], 
        "Enterprise Risk Mgmt": ["Properties", "Debt", "Comments", "Insurance", "Risk", "Registrar"],
        "Chris Properties": [
            "000-data template", "001-loan data", "7300-Greensland LLC", "BG Champion Partners LLC", "Boulder Bancroft Partners LLC", 
            "BVBP LLC", "Toperleaf Investments LLC", "Orbs Partners LLC", "DFIU LLC", "Dundee Village LLC", "Eagle Annex LLC", 
            "Fast Avenue Properties LLC", "Retina Unit LLC", "Heston Point LLC", "Lincoln Portfolio LLC", "Lions Gate Partners LLC", 
            "Midwest Portfolio 1 LLC", "Midwest Portfolio 2 LLC", "Midwest Portfolio 3 LLC", "Midwest Portfolio 4 LLC", 
            "Midwest Portfolio 5 LLC", "Midwest Portfolio 7 LLC", "Midwest Portfolio 8 LLC", "MB Brothers LLC", "MCCCS Properties LLC", 
            "MBD Properties LLC", "OCC Holdings LLC", "Original 3 LLC", "Partners of Australia LLC", "Partners of Park Place LLC", 
            "Patrick Place Partner LLC", "Reserve Partners LLC", "Red Park 2 LLC", "Red Park LLC", "Redchmar Partners LLC", 
            "Ridgemar Partners", "Sarpy Douglas Investments", "Skylar Development", "Sunesta (6990 St LLC)", 
            "Tall Oaks Partners LLC", "The Maples Partner LLC"
        ],
        "PGO": ["LLS L10", "Spreads"],
        "LLS Operations": ["LLS L10"],
        "Chris Mitch": [] 
      };

      // === STATE ===
      let currentAction = ''; 
      let currentSpace = '';
      let currentFolder = '';
      let currentItem = ''; // List or Task ID

      // --- NAVIGATION CONTROLLER ---
      function goToStep2(action) {
        currentAction = action;
        showView('step-2');
      }

      function goBack(step) {
        if (step === 1) showView('step-1');
        else if (step === 2) showView('step-2');
        else if (step === 3) showView('folders-view');
        else if (step === 'loading') showView('folders-view'); 
        else if (step === 'form') showView('items-view');
      }

      function showView(viewId) {
        const views = ['step-1', 'step-2', 'folders-view', 'loading-view', 'items-view', 'form-view'];
        views.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
      }

      // === STEP 2 -> 3: SELECT SPACE & SHOW HARDCODED FOLDERS ===
      function handleSpaceClick(spaceName) {
        currentSpace = spaceName;
        const folders = spaceData[spaceName];

        const container = document.getElementById('folders-container');
        container.innerHTML = ''; 

        // CASE A: Space has folders
        if (folders && folders.length > 0) {
            folders.forEach(name => {
                createButton(name, container, () => handleFolderClick(name));
            });
        } 
        // CASE B: Space has NO folders
        else {
             createButton("Go to " + spaceName + " Lists", container, () => handleFolderClick(""));
        }

        showView('folders-view');
      }

      // === STEP 3 -> 4: SELECT FOLDER & CALL WEBHOOK ===
      async function handleFolderClick(folderName) {
        currentFolder = folderName;
        
        const type = (currentAction === 'create a new task') ? "get list" : "get task";
        const loadingMsg = (type === "get list") ? "Getting lists..." : "Getting tasks...";

        document.getElementById('loading-text').innerText = loadingMsg;
        showView('loading-view');

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              action: currentAction, 
              space: currentSpace,
              folder: currentFolder,
              type: type
            })
          });

          if (!response.ok) throw new Error("Network error");
          const data = await response.json(); 
          renderItems(data, type);
          showView('items-view');

        } catch (error) {
          console.error("Error:", error);
          alert("Error fetching data. Check console.");
          showView('folders-view');
        }
      }

      // --- RENDER DYNAMIC ITEMS (Lists or Tasks) ---
      function renderItems(dataList, type) {
        const container = document.getElementById('items-container');
        container.innerHTML = ''; 
        
        document.getElementById('items-title').innerText = (type === "get list") ? "Select a List" : "Select a Task";

        if (!dataList) {
           container.innerHTML = '<div style="text-align:center; color:#888;">No items found.</div>';
           return;
        }
        if (!Array.isArray(dataList)) dataList = [dataList];

        dataList.forEach(item => {
            // Handle array wrapper if present (Fix for loop)
            if (item.name) {
                // If Array
                if (Array.isArray(item.name)) {
                     item.name.forEach(n => {
                        if (n && !n.includes("No Folders") && !n.includes("No List")) {
                             createButton(n, container, () => handleItemClick(n));
                        }
                     });
                }
                // If String
                else if (typeof item.name === 'string') {
                     if (!item.name.includes("No Folders") && !item.name.includes("No List")) {
                          createButton(item.name, container, () => handleItemClick(item.name));
                     }
                }
            }
        });

        // Check if empty after filtering
        if(container.innerHTML === '') {
             container.innerHTML = '<div style="text-align:center; color:#888;">No available items.</div>';
        }
      }

      // === STEP 4 -> 5: HANDLE ITEM CLICK ===
      function handleItemClick(itemName) {
        currentItem = itemName;

        if (currentAction === 'create a new task') {
            // CREATE FLOW: Open Form
            showView('form-view');
        } else {
            // UPDATE/DELETE FLOW: Send Webhook Immediately
            submitFinalWebhook();
        }
      }

      // === HELPER: Create Button ===
      function createButton(text, container, onClick) {
          const btn = document.createElement('button');
          btn.innerText = text;
          btn.onclick = onClick;
          container.appendChild(btn);
      }

      // --- FINAL SUBMIT (For Create Form) ---
      function submitForm() {
        const title = document.getElementById('task-title').value;
        const desc = document.getElementById('task-desc').value;
        const assignee = document.getElementById('task-assignee').value;
        
        // NEW FIELDS
        const startDate = document.getElementById('task-start-date').value;
        const dueDate = document.getElementById('task-due-date').value;

        if(!title) {
          alert("Title is required!");
          return;
        }
        
        // Prepare Data
        const payload = { 
            action: currentAction,
            space: currentSpace,
            folder: currentFolder,
            list: currentItem, 
            title: title,
            description: desc,
            assignee: assignee,
            startDate: startDate, // YYYY-MM-DD
            dueDate: dueDate      // YYYY-MM-DD
        };

        sendFinalData(payload);
      }

      // --- FINAL SUBMIT (For Update/Delete) ---
      function submitFinalWebhook() {
          const payload = {
              action: currentAction,
              space: currentSpace,
              folder: currentFolder,
              task: currentItem 
          };
          
          if (confirm(`Are you sure you want to ${currentAction}: "${currentItem}"?`)) {
              sendFinalData(payload);
          }
      }

      // --- SEND DATA FUNCTION ---
      async function sendFinalData(payload) {
        try {
             await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("Success! Request sent.");
            // Reset to start
            goBack(1);
        } catch (e) {
            alert("Error sending request.");
        }
      }
    </script>
  </body>
</html>
